<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Dark Circular Background -->
  <rect width="500" height="500" fill="#120C0A" rx="250"/>
  
  <g fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Outer Circular Ring with openings -->
    <!-- Top Arc -->
    <path d="M 120 200 A 160 160 0 0 1 380 200" />
    
    <!-- Bottom Arc -->
    <path d="M 380 300 A 160 160 0 0 1 120 300" />

    <!-- Inner Interlocking 'S' Geometry -->
    <!-- Top-left entering loop -->
    <path d="M 120 200 L 220 200 A 50 50 0 0 1 270 250 L 270 260 L 190 340 L 140 340" />

    <!-- Bottom-right entering loop -->
    <path d="M 380 300 L 280 300 A 50 50 0 0 1 230 250 L 230 240 L 310 160 L 360 160" />

    <!-- Diagonal Center Link -->
    <path d="M 190 340 L 310 160" stroke-width="32" />
  </g>
</svg>
